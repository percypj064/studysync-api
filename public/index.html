<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>StudySync Eventos</title>

  <style>

    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .evento {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 5px solid #007bff;
      border-radius: 5px;
    }

  </style>

</head>

<body>

  <h1>Eventos en Tiempo Real</h1>

  <div id="eventos"></div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    const contenedor = document.getElementById("eventos");

    socket.on("nuevo-evento", (data) => {

      console.log(data);

      const div = document.createElement("div");

      div.classList.add("evento");

      div.innerHTML = `
        <h3>${data.tipo}</h3>
        <p><strong>Canal:</strong> ${data.canal}</p>
        <pre>${JSON.stringify(data.payload, null, 2)}</pre>
        <small>${data.timestamp}</small>
      `;

      contenedor.prepend(div);

    });

  </script>

</body>

</html>
